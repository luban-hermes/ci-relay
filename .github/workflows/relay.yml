name: relay
run-name: relay ${{ github.event.client_payload.id }}
on:
  repository_dispatch:
    types: [build]
permissions: {}
jobs:
  build:
    runs-on: ${{ github.event.client_payload.os }}
    timeout-minutes: 30
    steps:
      - name: 读取参数
        shell: bash
        run: |
          for k in src_url put_url; do
            v=$(jq -r ".client_payload.$k // empty" "$GITHUB_EVENT_PATH")
            [ -n "$v" ] && echo "::add-mask::$v"
            echo "${k^^}=$v" >> "$GITHUB_ENV"
          done
      - name: 构建
        shell: bash
        run: |
          set +e
          mkdir -p src res
          { curl -fsSL "$SRC_URL" | tar -xz -C src --strip-components=1 && cd src && sh ci/relay-build.sh && cd ..; } > res/build.log 2>&1
          rc=$?
          cd "$GITHUB_WORKSPACE"
          echo "$rc" > res/rc
          [ -d src/out ] && cp -R src/out res/out
          tar -czf res.tgz res
          curl -fsS -o /dev/null -X PUT -T res.tgz "$PUT_URL" || { echo "上传失败"; exit 2; }
          echo "构建结果 $rc"
          exit "$rc"
