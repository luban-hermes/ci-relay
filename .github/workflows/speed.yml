name: speed
run-name: speed ${{ github.event.client_payload.id }}
on:
  repository_dispatch:
    types: [speed]
permissions: {}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - shell: bash
        run: |
          set +e +o pipefail
          jq -r '.client_payload.urls[] | "\(.name) \(.url)"' "$GITHUB_EVENT_PATH" > /tmp/u
          while read n u; do echo "::add-mask::$u"; done < /tmp/u
          for round in 1 2 3; do
            while read -u 9 n u; do
              rm -rf x f; mkdir x
              s=$(date +%s.%N)
              code=$(curl -sSL -o f -w '%{http_code} %{size_download} %{speed_download}' "$u")
              m=$(date +%s.%N)
              tar -xzf f -C x 2>/dev/null
              e=$(date +%s.%N)
              echo "round$round $n http/bytes/Bps=$code dl=$(awk "BEGIN{printf \"%.2f\", $m-$s}")s total=$(awk "BEGIN{printf \"%.2f\", $e-$s}")s"
            done 9< /tmp/u
          done
          A=https://gitea.tututool.tech/assets/js/index.BknsEH1f.js
          for round in 1 2 3; do
            s=$(date +%s.%N); n=0
            for i in $(seq 23); do echo "url = \"$A\""; echo "output = /dev/null"; done > /tmp/k
            curl -s -H 'Accept-Encoding: identity' -K /tmp/k -w '%{size_download}\n' > /tmp/sz
            e=$(date +%s.%N)
            echo "round$round gitea-asset23 bytes=$(awk '{t+=$1} END{print t}' /tmp/sz) total=$(awk "BEGIN{printf \"%.2f\", $e-$s}")s"
          done
